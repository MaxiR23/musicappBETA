# .github/workflows/update-feed.yml
name: Update Feed Data

on:
  workflow_dispatch:
  
  schedule:
    # Lunes 2am Argentina = 5am UTC
    - cron: '0 5 * * 1'  # most_played
    
    # Cada 2 días a las 2am Argentina = 5am UTC (lun, mié, vie, dom)
    - cron: '0 5 * * 1,3,5,0'  # new_releases

    # Viernes 2am Argentina = 5am UTC
    - cron: '0 5 * * 5'  # seed_tracks
    
    # Lunes 4am Argentina = 7am UTC
    - cron: '0 7 * * 1'  # recommendations

jobs:
  update-most-played:
    if: github.event.schedule == '0 5 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install --no-deps -r requirements.txt
      
      - name: Update most_played
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEED_CLIENT_ID: ${{ secrets.FEED_CLIENT_ID }}
          FEED_CLIENT_SECRET: ${{ secrets.FEED_CLIENT_SECRET }}
          FEED_MOST_PLAYED_ALBUMS_URL: ${{ secrets.FEED_MOST_PLAYED_ALBUMS_URL }}
          FEED_MOST_PLAYED_SONGS_URL: ${{ secrets.FEED_MOST_PLAYED_SONGS_URL }}
          PYTHONPATH: .
        run: python scripts/store_feed_data.py --only-most-played
      
      - name: Summary
        run: echo "Most played updated - $(date)"

  update-new-releases:
    if: github.event.schedule == '0 5 * * 1,3,5,0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install --no-deps -r requirements.txt
      
      - name: Update new_releases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEED_CLIENT_ID: ${{ secrets.FEED_CLIENT_ID }}
          FEED_CLIENT_SECRET: ${{ secrets.FEED_CLIENT_SECRET }}
          FEED_NEW_RELEASES_URL: ${{ secrets.FEED_NEW_RELEASES_URL }}
          FEED_MUSIC_RELEASE_PLAYLIST_ID: ${{ secrets.FEED_MUSIC_RELEASE_PLAYLIST_ID }}
          FEED_STORE: AR
          FEED_LIMIT: 25
          PYTHONPATH: .
        run: python scripts/store_feed_data.py --only-new-releases --only-new-singles --store AR --limit 25
      
      - name: Summary
        run: echo "New releases updated - $(date)"

  update-seed-tracks:
    if: github.event.schedule == '0 5 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install --no-deps -r requirements.txt
      
      - name: Update seed_tracks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEED_CLIENT_ID: ${{ secrets.FEED_CLIENT_ID }}
          FEED_CLIENT_SECRET: ${{ secrets.FEED_CLIENT_SECRET }}
          FEED_MUSIC_RELEASE_PLAYLIST_ID: ${{ secrets.FEED_MUSIC_RELEASE_PLAYLIST_ID }}
          PYTHONPATH: .
        run: python scripts/store_feed_data.py --only-seed-tracks --limit 25
      
      - name: Summary
        run: echo "Seed tracks updated - $(date)"

  update-recommendations:
    if: github.event.schedule == '0 7 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install --no-deps -r requirements.txt
      
      - name: Update user recommendations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEED_CLIENT_ID: ${{ secrets.FEED_CLIENT_ID }}
          FEED_CLIENT_SECRET: ${{ secrets.FEED_CLIENT_SECRET }}
          PYTHONPATH: .
        run: python scripts/store_user_recommendations.py --all-users
      
      - name: Summary
        run: echo "User recommendations updated - $(date)"